<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AURA MOTORS 管理员登录。">
  <title>AURA MOTORS | 管理员登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="supabase-config.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="admin-header">
    <a class="brand" href="./"><span>AURA</span><b>/</b><em>MOTORS</em></a>
    <div class="admin-user"><span class="status-dot"></span><span>管理员登录</span><a href="./">返回前台 ↗</a></div>
  </header>
  <main class="admin-main">
    <section class="login-page-panel">
      <p class="eyebrow">ADMIN ACCESS</p>
      <h1>管理员登录</h1>
      <p class="login-description">登录后进入预约管理 dashboard。</p>
      <form class="login-panel">
        <div class="login-fields"><input name="email" type="email" placeholder="管理员邮箱" autocomplete="username" required><input name="password" type="password" placeholder="密码" autocomplete="current-password" required><button class="login-button" type="submit">登录 ↗</button></div>
        <p class="login-status" role="alert"></p>
      </form>
    </section>
  </main>
  <footer><span>AURA MOTORS / INTERNAL</span><span>SECURE ACCESS</span></footer>
</body>
</html>
